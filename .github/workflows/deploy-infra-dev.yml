# See README.md for secrets and variables
name: Deploy Infrastructure - dev

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    environment: dev
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets/vars
        shell: bash
        run: |
          set -e

          # Auth
          [ -z "${{ secrets.CICD_CLIENT_ID }}" ] && ( echo "CICD_CLIENT_ID secret required"; exit 1; )
          [ -z "${{ vars.AZURE_SUBSCRIPTION_ID }}" ] && ( echo "AZURE_SUBSCRIPTION_ID var required"; exit 1; )
          [ -z "${{ vars.AZURE_TENANT_ID }}" ] && ( echo "AZURE_TENANT_ID var required"; exit 1; )

          # Azure basics
          [ -z "${{ vars.RESOURCE_GROUP }}" ] && ( echo "RESOURCE_GROUP var required"; exit 1; )
          [ -z "${{ vars.AZURE_LOCATION }}" ] && ( echo "AZURE_LOCATION var required"; exit 1; )
          [ -z "${{ vars.ACR_NAME }}" ] && ( echo "ACR_NAME var required"; exit 1; )

          # Image + app settings
          [ -z "${{ vars.IMAGE_NAME }}" ] && ( echo "IMAGE_NAME var required (e.g. github-mcp-server)"; exit 1; )
          [ -z "${{ vars.CONTAINER_NAME }}" ] && ( echo "CONTAINER_NAME var required (used for deployment naming)"; exit 1; )
          [ -z "${{ vars.CONTAINER_PORT }}" ] && ( echo "CONTAINER_PORT var required (e.g. 3000)"; exit 1; )

          # Bicep params
          [ -z "${{ vars.PLUGIN_VNET_CIDR_B }}" ] && ( echo "PLUGIN_VNET_CIDR_B var required"; exit 1; )
          [ -z "${{ vars.PLUGIN_NAME }}" ] && ( echo "PLUGIN_NAME var required"; exit 1; )

          # Atlassian OAuth
          [ -z "${{ secrets.ATLASSIAN_OAUTH_CLIENT_ID }}" ] && ( echo "ATLASSIAN_OAUTH_CLIENT_ID secret required"; exit 1; )
          [ -z "${{ secrets.ATLASSIAN_OAUTH_CLIENT_SECRET }}" ] && ( echo "ATLASSIAN_OAUTH_CLIENT_SECRET secret required"; exit 1; )
          [ -z "${{ vars.ATLASSIAN_OAUTH_REDIRECT_URI }}" ] && ( echo "ATLASSIAN_OAUTH_REDIRECT_URI var required"; exit 1; )
          [ -z "${{ vars.ATLASSIAN_OAUTH_SCOPE }}" ] && ( echo "ATLASSIAN_OAUTH_SCOPE var required"; exit 1; )
          [ -z "${{ vars.PUBLIC_BASE_URL }}" ] && ( echo "PUBLIC_BASE_URL var required"; exit 1; )

          exit 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: Azure/login@v2
        with:
          client-id: ${{ secrets.CICD_CLIENT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}

      - name: Set subscription (explicit)
        shell: bash
        run: |
          set -euxo pipefail
          az account set --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          az account show -o table

      - name: Ensure ACR exists (create if missing) + verify
        shell: bash
        run: |
          set -euxo pipefail

          az acr show -n "${{ vars.ACR_NAME }}" -g "${{ vars.RESOURCE_GROUP }}" -o table || true

          az acr create -n "${{ vars.ACR_NAME }}" \
            -g "${{ vars.RESOURCE_GROUP }}" \
            --location "${{ vars.AZURE_LOCATION }}" \
            --sku Basic \
            --admin-enabled true || true

          az acr show -n "${{ vars.ACR_NAME }}" -g "${{ vars.RESOURCE_GROUP }}" -o table

      - name: Build and push image to ACR
        shell: bash
        run: |
          set -euxo pipefail

          test -f Dockerfile

          az acr login --name "${{ vars.ACR_NAME }}"

          IMAGE_REPO="${{ vars.IMAGE_NAME }}"
          IMG="${{ vars.ACR_NAME }}.azurecr.io/${IMAGE_REPO}"

          docker build -t "${IMG}:${GITHUB_SHA}" -f Dockerfile .
          docker push "${IMG}:${GITHUB_SHA}"

          docker tag "${IMG}:${GITHUB_SHA}" "${IMG}:latest"
          docker push "${IMG}:latest"

      - name: Deploy Bicep template
        shell: bash
        run: |
          set -euxo pipefail

          ACR_PASSWORD="$(az acr credential show -n "${{ vars.ACR_NAME }}" --query "passwords[0].value" -o tsv)"

          DEPLOY_NAME="${{ vars.CONTAINER_NAME }}-infra"

          az deployment group create \
            --name "${DEPLOY_NAME}" \
            --mode Incremental \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --template-file infra/bicep/main.bicep \
            --parameters \
              env=dev \
              location="${{ vars.AZURE_LOCATION }}" \
              pluginVnetCidrB=${{ vars.PLUGIN_VNET_CIDR_B }} \
              pluginName="${{ vars.PLUGIN_NAME }}" \
              mcpServerImage="${{ vars.IMAGE_NAME }}" \
              mcpServerImagePort=${{ vars.CONTAINER_PORT }} \
              mcpImageTag="${GITHUB_SHA}" \
              acrName="${{ vars.ACR_NAME }}" \
              acrPassword="${ACR_PASSWORD}" \
              atlassianOauthClientId="${{ secrets.ATLASSIAN_OAUTH_CLIENT_ID }}" \
              atlassianOauthClientSecret="${{ secrets.ATLASSIAN_OAUTH_CLIENT_SECRET }}" \
              atlassianOauthRedirectUri="${{ vars.ATLASSIAN_OAUTH_REDIRECT_URI }}" \
              atlassianOauthScope="${{ vars.ATLASSIAN_OAUTH_SCOPE }}" \
              publicBaseUrl="${{ vars.PUBLIC_BASE_URL }}"
